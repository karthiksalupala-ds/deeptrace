services:
  - type: web
    name: deeptrace-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: STORAGE_BACKEND
        value: local
      - key: PYTHON_VERSION
        value: 3.11.9
